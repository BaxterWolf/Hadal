<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3d33"/>
      <stop offset="0.45" stop-color="#0d2230"/>
      <stop offset="1" stop-color="#03070b"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.27" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ff3b30" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcc8" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#9fdcc8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8cf95"/>
      <stop offset="0.55" stop-color="#c9a45c"/>
      <stop offset="1" stop-color="#7f6a44"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a45c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#c9a45c" stop-opacity="0"/>
    </linearGradient>

    <!-- Helmet -->
    <radialGradient id="bronze" cx="0.42" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#2c3d37"/><stop offset="0.45" stop-color="#141c1b"/><stop offset="1" stop-color="#05080a"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f6a44"/><stop offset="1" stop-color="#34281a"/>
    </linearGradient>
    <linearGradient id="sink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#03060a" stop-opacity="0"/><stop offset="1" stop-color="#03060a" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="spill" gradientUnits="userSpaceOnUse" cx="54" cy="50" r="23">
      <stop offset="0.67" stop-color="#ff3b30" stop-opacity="0.3"/><stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.35"/><stop offset="0.6" stop-color="#b3001b" stop-opacity="0.1"/><stop offset="1" stop-color="#b3001b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeCore" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#ffb199"/><stop offset="0.35" stop-color="#ff3b2f"/><stop offset="1" stop-color="#a50f1a"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="win"><circle cx="54" cy="50" r="15.5"/></clipPath>
    <clipPath id="dome"><path d="M54 12 C77 12 91 28 91 46 C91 61 85 71 79 80 L29 80 C23 71 17 61 17 46 C17 28 31 12 54 12Z"/></clipPath>
    <clipPath id="helmetClip">
      <path d="M54 12 C77 12 91 28 91 46 C91 61 85 71 79 80 L29 80 C23 71 17 61 17 46 C17 28 31 12 54 12Z"/>
      <rect x="24" y="79" width="60" height="7" rx="2"/>
    </clipPath>
    <clipPath id="ring"><path d="M54 27 A23 23 0 1 1 53.99 27Z M54 34.5 A15.5 15.5 0 1 0 54.01 34.5Z" clip-rule="evenodd"/></clipPath>
    <g id="eyes">
      <ellipse cx="39" cy="62" rx="16" ry="10" fill="url(#eyeGlow)"/>
      <ellipse cx="69" cy="62" rx="16" ry="10" fill="url(#eyeGlow)"/>
      <path d="M27 55 L50 61.5 Q46 70 37 69 Q27 67 27 55Z" fill="url(#eyeCore)" filter="url(#blur)" opacity="0.35"/>
      <path d="M81 55 L58 61.5 Q62 70 71 69 Q81 67 81 55Z" fill="url(#eyeCore)" filter="url(#blur)" opacity="0.35"/>
      <path d="M27 55 L50 61.5 Q46 70 37 69 Q27 67 27 55Z" fill="url(#eyeCore)"/>
      <path d="M81 55 L58 61.5 Q62 70 71 69 Q81 67 81 55Z" fill="url(#eyeCore)"/>
    </g>
    <g id="portL">
      <rect x="15.5" y="35" width="7" height="30" rx="1.5" fill="#3a2d1b"/>
      <rect x="12.5" y="32" width="5" height="36" rx="2.5" fill="url(#brass)"/>
      <line x1="13.7" y1="35" x2="13.7" y2="65" stroke="#9a8256" stroke-width="0.6" opacity="0.8"/>
    </g>
  </defs>

  <!-- Sea -->
  <rect width="1280" height="420" fill="url(#sea)"/>
  <rect width="1280" height="420" fill="url(#haze)"/>
  <g fill="url(#ray)">
    <path d="M160 0 L250 0 L420 420 L270 420Z"/>
    <path d="M520 0 L560 0 L700 420 L610 420Z" opacity="0.7"/>
    <path d="M860 0 L930 0 L1060 420 L930 420Z" opacity="0.6"/>
    <path d="M1120 0 L1150 0 L1250 420 L1190 420Z" opacity="0.5"/>
  </g>
  <g fill="#cfe8df">
    <circle cx="64" cy="58" r="2" opacity="0.35"/><circle cx="132" cy="300" r="1.4" opacity="0.2"/><circle cx="210" cy="120" r="1.2" opacity="0.3"/>
    <circle cx="480" cy="44" r="1.6" opacity="0.3"/><circle cx="560" cy="350" r="1.1" opacity="0.15"/><circle cx="620" cy="96" r="1.3" opacity="0.25"/>
    <circle cx="700" cy="380" r="1.5" opacity="0.12"/><circle cx="780" cy="70" r="1.8" opacity="0.3"/><circle cx="840" cy="250" r="1.1" opacity="0.18"/>
    <circle cx="930" cy="130" r="1.4" opacity="0.25"/><circle cx="1010" cy="40" r="2" opacity="0.3"/><circle cx="1080" cy="320" r="1.2" opacity="0.15"/>
    <circle cx="1150" cy="170" r="1.6" opacity="0.22"/><circle cx="1230" cy="80" r="1.2" opacity="0.28"/><circle cx="1210" cy="370" r="1.4" opacity="0.12"/>
    <circle cx="380" cy="390" r="1.3" opacity="0.12"/><circle cx="430" cy="200" r="1" opacity="0.2"/><circle cx="20" cy="210" r="1.2" opacity="0.2"/>
  </g>

  <!-- Helmet -->
  <g transform="translate(150 50) scale(3.05)">
    <g transform="translate(0 6)">
      <use href="#portL"/>
      <use href="#portL" transform="translate(108 0) scale(-1 1)"/>
      <path d="M54 12 C77 12 91 28 91 46 C91 61 85 71 79 80 L29 80 C23 71 17 61 17 46 C17 28 31 12 54 12Z" fill="url(#bronze)"/>
      <g clip-path="url(#dome)" fill="none" stroke-linecap="round">
        <path d="M18.5 54 C17 32 31 13 54 12.6 C66 12.6 76 17 82 24" stroke="#7fc7b0" stroke-width="3.2" opacity="0.12"/>
        <path d="M18.5 50 C18 31 32 13.4 54 13.2 C64 13.2 72 16.5 78 21" stroke="#9fdcc8" stroke-width="1" opacity="0.5"/>
      </g>
      <rect x="24" y="79" width="60" height="7" rx="2" fill="url(#brass)"/>
      <line x1="26" y1="79.6" x2="82" y2="79.6" stroke="#a88f60" stroke-width="0.5" opacity="0.6"/>
      <rect x="26" y="45" width="7" height="10" rx="2" fill="url(#brass)"/><circle cx="26" cy="50" r="2.3" fill="#4e3f28"/>
      <rect x="75" y="40" width="6" height="20" rx="1.5" fill="url(#brass)"/>
      <circle cx="54" cy="50" r="23" fill="url(#brass)"/>
      <path d="M36 40 A21 21 0 0 1 64 30" stroke="#a88f60" stroke-width="0.7" fill="none" opacity="0.7"/>
      <circle cx="54" cy="50" r="15.5" fill="#030507"/>
      <circle cx="54" cy="50" r="15.5" fill="none" stroke="#241b10" stroke-width="1.2"/>
      <g fill="#241b10"><circle cx="40.2" cy="36.2" r="1.4"/><circle cx="67.8" cy="36.2" r="1.4"/><circle cx="40.2" cy="63.8" r="1.4"/><circle cx="67.8" cy="63.8" r="1.4"/></g>
      <rect x="8" y="8" width="92" height="82" fill="url(#sink)" clip-path="url(#helmetClip)"/>
      <circle cx="54" cy="50" r="23" fill="url(#spill)" clip-path="url(#ring)"/>
      <g clip-path="url(#win)"><g transform="translate(54 51) scale(0.64) translate(-54 -62)"><use href="#eyes"/></g></g>
    </g>
  </g>

  <!-- Title -->
  <text x="560" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="128" letter-spacing="22" fill="url(#title)">HADAL</text>
  <rect x="564" y="226" width="520" height="2" fill="url(#rule)"/>
  <text x="566" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="3" fill="#7fc7b0">Your PC, from the deep.</text>
  <text x="566" y="318" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="2" fill="#9fb8b0" opacity="0.85">WINDOWS  ·  ANDROID  ·  TAILSCALE ONLY</text>
</svg>
