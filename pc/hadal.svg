<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <!-- Master icon art -->
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5446"/>
      <stop offset="0.45" stop-color="#15303f"/>
      <stop offset="1" stop-color="#03060a"/>
    </linearGradient>
    <radialGradient id="bronze" cx="0.42" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#2c3d37"/>
      <stop offset="0.45" stop-color="#141c1b"/>
      <stop offset="1" stop-color="#05080a"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f6a44"/>
      <stop offset="1" stop-color="#34281a"/>
    </linearGradient>
    <linearGradient id="sink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#03060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#03060a" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="spill" gradientUnits="userSpaceOnUse" cx="54" cy="50" r="23">
      <stop offset="0.67" stop-color="#ff3b30" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#b3001b" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#b3001b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeCore" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#ffb199"/>
      <stop offset="0.35" stop-color="#ff3b2f"/>
      <stop offset="1" stop-color="#a50f1a"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="win"><circle cx="54" cy="50" r="15.5"/></clipPath>
    <clipPath id="dome"><path d="M54 12 C77 12 91 28 91 46 C91 61 85 71 79 80 L29 80 C23 71 17 61 17 46 C17 28 31 12 54 12Z"/></clipPath>
    <clipPath id="helmetClip">
