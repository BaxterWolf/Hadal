    <path d="M54 12 C77 12 91 28 91 46 C91 61 85 71 79 80 L29 80 C23 71 17 61 17 46 C17 28 31 12 54 12Z" fill="url(#bronze)"/>
    <g clip-path="url(#dome)" fill="none" stroke-linecap="round">
      <path d="M18.5 54 C17 32 31 13 54 12.6 C66 12.6 76 17 82 24" stroke="#7fc7b0" stroke-width="3.2" opacity="0.12"/>
      <path d="M18.5 50 C18 31 32 13.4 54 13.2 C64 13.2 72 16.5 78 21" stroke="#9fdcc8" stroke-width="1" opacity="0.5"/>
    </g>
    <rect x="24" y="79" width="60" height="7" rx="2" fill="url(#brass)"/>
    <line x1="26" y1="79.6" x2="82" y2="79.6" stroke="#a88f60" stroke-width="0.5" opacity="0.6"/>
    <rect x="26" y="45" width="7" height="10" rx="2" fill="url(#brass)"/><circle cx="26" cy="50" r="2.3" fill="#4e3f28"/>
    <rect x="75" y="40" width="6" height="20" rx="1.5" fill="url(#brass)"/>
    <circle cx="54" cy="50" r="23" fill="url(#brass)"/>
    <path d="M36 40 A21 21 0 0 1 64 30" stroke="#a88f60" stroke-width="0.7" fill="none" opacity="0.7"/>
    <circle cx="54" cy="50" r="15.5" fill="#030507"/>
    <circle cx="54" cy="50" r="15.5" fill="none" stroke="#241b10" stroke-width="1.2"/>
    <g fill="#241b10"><circle cx="40.2" cy="36.2" r="1.4"/><circle cx="67.8" cy="36.2" r="1.4"/><circle cx="40.2" cy="63.8" r="1.4"/><circle cx="67.8" cy="63.8" r="1.4"/></g>
    <rect x="8" y="8" width="92" height="82" fill="url(#sink)" clip-path="url(#helmetClip)"/>
    <circle cx="54" cy="50" r="23" fill="url(#spill)" clip-path="url(#ring)"/>
    <g clip-path="url(#win)"><g transform="translate(54 51) scale(0.64) translate(-54 -62)"><use href="#eyes"/></g></g>
