    <clipPath id="ring"><path d="M54 27 A23 23 0 1 1 53.99 27Z M54 34.5 A15.5 15.5 0 1 0 54.01 34.5Z" clip-rule="evenodd"/></clipPath>
    <g id="eyes">
      <ellipse cx="39" cy="62" rx="16" ry="10" fill="url(#eyeGlow)"/>
      <ellipse cx="69" cy="62" rx="16" ry="10" fill="url(#eyeGlow)"/>
      <path d="M27 55 L50 61.5 Q46 70 37 69 Q27 67 27 55Z" fill="url(#eyeCore)" filter="url(#blur)" opacity="0.35"/>
      <path d="M81 55 L58 61.5 Q62 70 71 69 Q81 67 81 55Z" fill="url(#eyeCore)" filter="url(#blur)" opacity="0.35"/>
      <path d="M27 55 L50 61.5 Q46 70 37 69 Q27 67 27 55Z" fill="url(#eyeCore)"/>
      <path d="M81 55 L58 61.5 Q62 70 71 69 Q81 67 81 55Z" fill="url(#eyeCore)"/>
    </g>
    <g id="portL">
      <rect x="15.5" y="35" width="7" height="30" rx="1.5" fill="#3a2d1b"/>
      <rect x="12.5" y="32" width="5" height="36" rx="2.5" fill="url(#brass)"/>
      <line x1="13.7" y1="35" x2="13.7" y2="65" stroke="#9a8256" stroke-width="0.6" opacity="0.8"/>
    </g>
  </defs>
  <g id="background">
    <rect width="108" height="108" fill="url(#deep)"/>
    <g fill="#cfe8df">
      <circle cx="12" cy="18" r="0.9" opacity="0.5"/><circle cx="96" cy="14" r="0.7" opacity="0.4"/>
      <circle cx="100" cy="30" r="0.6" opacity="0.35"/><circle cx="6" cy="34" r="0.7" opacity="0.3"/>
      <circle cx="24" cy="5" r="0.6" opacity="0.3"/><circle cx="88" cy="98" r="0.6" opacity="0.2"/>
    </g>
  </g>
